name: student_study_copilot
description: "رفيق الطالب الجامعي - تطبيق أندرويد و iOS لإدارة المحاضرات والتكليفات بالذكاء الاصطناعي"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.10.0 <4.0.0'

dependencies:
  archive: ^4.6.0
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  google_fonts: ^6.2.1
  http: ^1.2.0
  intl: ^0.19.0
  path_provider: ^2.1.4
  provider: ^6.1.2
  share_plus: ^7.2.2
  file_picker: ^13.3.3
  path: ^1.9.1
  sqflite: ^2.4.6
  read_pdf_text: ^0.3.1
  tesseract_ocr: ^0.5.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/tessdata_config.json
    - assets/tessdata/
